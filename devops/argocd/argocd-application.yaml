apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frankenphp
  annotations:
    argocd-image-updater.argoproj.io/image-list: frankenphp=docker.io/devho/franken-php:latest
    argocd-image-updater.argoproj.io/frankenphp.update-strategy: digest
    argocd-image-updater.argoproj.io/frankenphp.pull-secret: regsecret
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/quynhhodev/symfony-frankenphp.git
    targetRevision: main
    path: devops
    directory:
      # Loại trừ thư mục argocd (bootstrap files)
      exclude: 'argocd/**'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # Xóa resource không còn trong Git
      selfHeal: true   # Tự phục hồi nếu cluster bị drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
