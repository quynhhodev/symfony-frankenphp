# Đưa overlay multipass (devops/overlays/multipass) vào ArgoCD quản lý.
#
# File bootstrap: nằm ngoài overlay nên ArgoCD không tự quản chính nó. Apply tay:
#   kubectl --context multipass apply -n argocd -f devops/argocd/argocd-application.yaml
#
# LƯU Ý: file không khai báo metadata.namespace, nên `-n argocd` là bắt buộc.
# Thiếu nó thì Application rơi vào ns default và argocd không thấy.
#
# Đổi `path` sang overlay khác là đổi TOÀN BỘ những gì ArgoCD coi là "phải có". Vì
# `prune: true`, resource nào overlay mới không render ra sẽ bị xoá khỏi cụm. Trước khi
# đổi: tắt `automated`, trỏ sang đường dẫn mới, chờ refresh, và chỉ bật lại khi mọi
# resource đều Synced.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frankenphp
spec:
  project: default
  source:
    repoURL: https://github.com/quynhhodev/symfony-frankenphp.git
    targetRevision: main
    # ArgoCD thấy kustomization.yaml là tự chạy `kustomize build`. CỐ Ý không khai
    # `directory:`: khối đó ép chế độ đọc YAML thô, ArgoCD sẽ coi kustomization.yaml và
    # các file patch như manifest thật.
    path: devops/overlays/multipass
  destination:
    server: https://kubernetes.default.svc
    # Khớp `namespace:` của devops/base/kustomization.yaml.
    namespace: frankenphp
  # StatefulSet có `volumeClaimTemplates` thì API server nhồi vào đó những field mà Git
  # không thể khai báo được — `status: {phase: Pending}`, `apiVersion`, `kind`,
  # `metadata.creationTimestamp: null`. ArgoCD không normalize được nên StatefulSet đỏ
  # OutOfSync vĩnh viễn dù cluster đúng y như Git.
  #
  # Bỏ qua nghe rộng, nhưng `volumeClaimTemplates` là field IMMUTABLE — muốn đổi phải xoá
  # tạo lại StatefulSet — nên thực tế không mất khả năng phát hiện drift nào đáng kể.
  #
  # Đây không phải chuyện thẩm mỹ: còn vết đỏ giả là còn người muốn tick Force cho nó
  # xanh, và Force trên PVC là cách data postgres bay mất ngày 25/08/2026.
  #
  # CỐ Ý không ghi `name:` — rule áp cho MỌI StatefulSet. Ghi đích danh `postgres` thì mỗi
  # StatefulSet mới lại đỏ cho tới khi có người nhớ thêm entry, và rabbitmq đã dính đúng
  # vậy. Lập luận IMMUTABLE ở trên đúng cho mọi StatefulSet chứ không riêng postgres.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      # Xoá resource đã bị bỏ khỏi Git. Đây là thứ dọn 5 resource còn lại của
      # image-watcher (CronJob + SA + Role + RoleBinding + ConfigMap).
      prune: true
      #
      # selfHeal CỐ Ý chưa bật.
      #
      # Auto-sync theo commit đã đủ cho auto-rollout. selfHeal chỉ thêm phần đè
      # drift thủ công, nhưng mỗi lần nó kích Sync là hook PostSync
      # (doctrine-migrations) chạy lại — mà app này chưa từng sync xanh lần nào.
      # Có resource nào kẹt OutOfSync là thành vòng lặp sync vô tận.
      #
      # Chỉ thêm `selfHeal: true` sau khi app đứng Synced/Healthy ổn định qua
      # vài lần push, rồi apply lại file này.
    syncOptions:
      # ArgoCD tạo namespace `frankenphp` và KHÔNG BAO GIỜ xoá nó, kể cả khi prune. Vì
      # vậy namespace khai ở đây chứ không là object trong base (xem kustomization.yaml).
      - CreateNamespace=true
      - ServerSideApply=true
    # Label của namespace do ArgoCD tạo. Pod Security:
    # - enforce=baseline: chặn pod chạy privileged, hostPath, host network... Mọi pod
    #   hiện tại đều đạt (đã dry-run).
    # - warn/audit=restricted: chưa chặn, vì Postgres, RabbitMQ và Reloader (image bên
    #   thứ ba) chưa đạt restricted. Chỉ cảnh báo, để thấy pod nào còn lệch chuẩn.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
