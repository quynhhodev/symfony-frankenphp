# Chạy thử trên minikube ở máy local, với image build ngay trong minikube:
#
#   minikube image build -t franken-php:dev -f docker/frankenphp/Dockerfile .
#   kubectl create namespace frankenphp
#   kubectl apply -k devops/overlays/minikube
#
# `kubectl apply -k` không tự tạo namespace (ở cụm multipass ArgoCD tạo, xem
# argocd-application.yaml), nên phải tạo tay trước.
#
# Cụm vẫn cần Traefik (Ingress class `traefik` và CRD Middleware), cài bằng Helm như
# devops/MIGRATION-traefik.md. Không ArgoCD nào trỏ vào đây.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Image build local, không có trên Docker Hub.
images:
  - name: devho/franken-php
    newName: franken-php
    newTag: dev

patches:
  # Base để `Always` vì tag trên Docker Hub luôn kéo về bản mới nhất. Image local thì
  # Always làm kubelet đi tìm `franken-php:dev` trên Docker Hub và kẹt ErrImagePull.
  #
  # Strategic merge chứ không JSON patch `/containers/0`: `containers` có khoá merge
  # là `name`, nên patch tìm đúng container theo tên. Theo chỉ số thì thêm một sidecar
  # đứng trước là patch âm thầm sửa nhầm container.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frankenphp
      spec:
        template:
          spec:
            containers:
              - name: frankenphp
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: messenger-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: doctrine-migrations
      spec:
        template:
          spec:
            containers:
              - name: migration
                imagePullPolicy: IfNotPresent

  # minikube không có `local-path`, StorageClass mặc định tên `standard`.
  # volumeClaimTemplates là list không có khoá merge: phải vá theo chỉ số bằng JSON
  # patch, strategic merge sẽ thay cả template và mất accessModes, dung lượng.
  - target:
      kind: StatefulSet
      name: postgres|rabbitmq
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
