# SINH BỞI devops/scripts/seal-secrets.sh, đừng sửa tay. Chỉ controller của
# cụm multipass mở được (khóa riêng của cụm, scope strict: đúng namespace và tên).
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: frankenphp-secret
  namespace: frankenphp
spec:
  encryptedData:
    database_url: 
    messenger_transport_dsn: 
    password: 
  template:
    metadata:
      name: frankenphp-secret
      namespace: frankenphp
    type: Opaque
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rabbitmq-definitions
  namespace: frankenphp
spec:
  encryptedData:
    definitions.json: 
  template:
    metadata:
      name: rabbitmq-definitions
      namespace: frankenphp
    type: Opaque
