# Cụm kubeadm local trên multipass. ArgoCD (devops/argocd/argocd-application.yaml)
# trỏ vào đây.
#
# Không vá gì: base được viết đúng cho cụm này (StorageClass local-path, Ingress class
# traefik, host *.local trong /etc/hosts). Có overlay riêng để cụm khác không phải
# đụng vào base, và để chỗ khác biệt về sau của multipass có nơi để ghi.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
