# Tự động rollout khi có build mới trên Docker Hub.
# Cơ chế: mỗi phút hỏi registry xem digest của tag :latest là gì, so với image
# đang chạy trong deployment. Khác nhau => kubectl set image sang digest mới
# => Kubernetes tự rolling update. Không cần rollout restart tay.
#
# Pin theo digest (repo@sha256:...) thay vì :latest nên mỗi lần đổi là một thay
# đổi thật trong pod spec, và biết chính xác pod đang chạy build nào.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-watcher
rules:
  # Chỉ đủ quyền đọc và sửa image của deployment, không hơn.
  # list/watch là bắt buộc cho `kubectl rollout status` — thiếu là nó treo.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-watcher
subjects:
  - kind: ServiceAccount
    name: image-watcher
roleRef:
  kind: Role
  name: image-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-watcher-script
data:
  watch.sh: |
    #!/bin/sh
    set -eu

    : "${REPO:?thiếu REPO}" "${TAG:?thiếu TAG}"
    : "${DEPLOYMENT:?thiếu DEPLOYMENT}" "${CONTAINER:?thiếu CONTAINER}"

    # 1. Lấy user/pass Docker Hub từ regsecret (mount read-only ở /creds).
    #    Nếu không có thì pull anonymous — vẫn chạy được với repo public.
    creds=""
    if [ -f /creds/.dockerconfigjson ]; then
      auth=$(jq -r '.auths | to_entries[] | select(.key | test("index.docker.io")) | .value.auth // empty' \
             /creds/.dockerconfigjson | head -1)
      [ -n "$auth" ] && creds=$(echo "$auth" | base64 -d)
    fi

    # 2. Xin pull token. Có creds thì dùng, thất bại thì thử anonymous.
    token=""
    url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull"
    if [ -n "$creds" ]; then
      token=$(curl -fsSL -u "$creds" "$url" | jq -r '.token // empty') || true
    fi
    if [ -z "$token" ]; then
      echo "auth kèm credentials không được, thử anonymous"
      token=$(curl -fsSL "$url" | jq -r '.token // empty')
    fi
    [ -n "$token" ] || { echo "LỖI: không lấy được pull token"; exit 1; }

    # 3. HEAD manifest để lấy digest của tag. Nhận cả manifest list (multi-arch)
    #    và manifest đơn, nếu không digest trả về sẽ lệch.
    digest=$(curl -fsS -I -H "Authorization: Bearer $token" \
      -H "Accept: application/vnd.oci.image.index.v1+json" \
      -H "Accept: application/vnd.oci.image.manifest.v1+json" \
      -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
      -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
      "https://registry-1.docker.io/v2/${REPO}/manifests/${TAG}" \
      | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
    case "$digest" in
      sha256:*) ;;
      *) echo "LỖI: digest không hợp lệ: '${digest}'"; exit 1 ;;
    esac

    # 4. So digest registry với image đang chạy
    current=$(kubectl get deployment "$DEPLOYMENT" \
      -o "jsonpath={.spec.template.spec.containers[?(@.name=='${CONTAINER}')].image}")
    desired="${REPO}@${digest}"

    if [ "$current" = "$desired" ]; then
      echo "không có build mới — vẫn đang ở ${digest}"
      exit 0
    fi

    echo "phát hiện build mới"
    echo "  đang chạy: ${current}"
    echo "  chuyển sang: ${desired}"
    kubectl set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${desired}"
    kubectl rollout status "deployment/${DEPLOYMENT}" --timeout=300s
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: frankenphp-image-watcher
spec:
  schedule: "* * * * *"          # mỗi phút — mức nhỏ nhất cron của K8s cho phép
  concurrencyPolicy: Forbid      # không cho 2 lần check chạy chồng nhau
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120   # bỏ qua lượt bị trễ quá lâu, không dồn hàng
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: image-watcher
          restartPolicy: Never
          containers:
            - name: watcher
              image: alpine/k8s:1.30.2
              imagePullPolicy: IfNotPresent
              command: ["sh", "/script/watch.sh"]
              env:
                - name: REPO
                  value: "devho/franken-php"
                - name: TAG
                  value: "latest"
                - name: DEPLOYMENT
                  value: "frankenphp"
                - name: CONTAINER
                  value: "frankenphp"
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: creds
                  mountPath: /creds
                  readOnly: true
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
          volumes:
            - name: script
              configMap:
                name: image-watcher-script
            - name: creds
              secret:
                secretName: regsecret
                optional: true   # repo public thì không cần secret
