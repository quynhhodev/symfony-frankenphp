apiVersion: batch/v1
kind: Job
metadata:
  name: doctrine-migrations
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      # Cùng securityContext với frankenphp-deployment.yaml (lý do ghi ở đó). Process
      # ở đây là `php`, không phải binary frankenphp, nên không cần NET_BIND_SERVICE.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: devho/franken-php:fca5981d8b623fdb1cd0bec459797cd8f86ecdd0
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        workingDir: /app/public
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: password
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: database_url
        envFrom:
          - configMapRef:
              name: frankenphp
