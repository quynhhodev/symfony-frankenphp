apiVersion: apps/v1
kind: Deployment
metadata:
  name: frankenphp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frankenphp
  template:
    metadata:
      labels:
        app: frankenphp
    spec:
      containers:
      - name: frankenphp
        image: devho/franken-php:2932f45fc03e8e214c55aca8dc184bc933eb35d5
        imagePullPolicy: Always
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: password
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: database_url
          # Token thật không nằm trong Git (repo public) — nạp bằng `kubectl patch
          # secret frankenphp-secret`. `optional: true` là bắt buộc: thiếu nó thì
          # mọi pod đứng CreateContainerConfigError cho tới khi có ai patch tay.
          - name: FACEBOOK_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: facebook_access_token
                optional: true
        envFrom:
          - configMapRef:
              name: frankenphp
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
        # Chờ container khởi động xong (tối đa 60s) trước khi bật liveness/readiness
        startupProbe:
          tcpSocket:
            port: 80
          periodSeconds: 2
          failureThreshold: 30
        # Kubernetes chỉ route traffic vào pod khi readiness pass
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Nếu liveness fail liên tục, Kubernetes sẽ restart container
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3



