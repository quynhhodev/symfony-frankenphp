apiVersion: apps/v1
kind: Deployment
metadata:
  name: frankenphp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frankenphp
  template:
    metadata:
      labels:
        app: frankenphp
    spec:
      containers:
      - name: frankenphp
        image: devho/franken-php:latest
        imagePullPolicy: Always
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: password
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: database_url
        envFrom:
          - configMapRef:
              name: frankenphp
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
      volumes:
      - name: frankenphp-volume
      imagePullSecrets:
      - name: regsecret



