apiVersion: apps/v1
kind: Deployment
metadata:
  name: frankenphp
  annotations:
    # Reloader rolling-restart khi ConfigMap `frankenphp` hoặc Secret
    # `frankenphp-secret` đổi. Thiếu nó thì ArgoCD sync xong nội dung mới nằm trong
    # cluster mà pod vẫn giữ giá trị cũ từ lúc khởi động — đúng cơ chế đã để
    # /env/data 500 suốt 25 phút ngày 26/08/2026 mà không ai biết.
    reloader.stakater.com/auto: "true"
spec:
  # Không khai `replicas`: số pod do HPA quyết định (devops/autoscaling/frankenphp-hpa.yaml).
  selector:
    matchLabels:
      app: frankenphp
  template:
    metadata:
      labels:
        app: frankenphp
    spec:
      # Đạt chuẩn Pod Security "restricted": lọt được vào container qua lỗ hổng PHP
      # thì vẫn kẹt ở uid 1000, không leo quyền, không capability, syscall bị lọc.
      #
      # runAsUser khai bằng số vì `runAsNonRoot` chỉ kiểm tra được uid dạng số, mà
      # image cũ (trước khi Dockerfile đổi sang `USER 1000:1000`) khai `USER app`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frankenphp
        image: devho/franken-php:fca5981d8b623fdb1cd0bec459797cd8f86ecdd0
        imagePullPolicy: Always
        # NET_BIND_SERVICE không phải để mở cổng (app nghe 8080): image gốc gắn sẵn
        # file capability đó lên binary frankenphp, thiếu nó trong bounding set thì
        # kernel từ chối exec ("Operation not permitted", exit 126). Restricted cho
        # phép thêm lại đúng một capability này.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: password
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: database_url
          # Token thật không nằm trong Git (repo public) — nạp bằng `kubectl patch
          # secret frankenphp-secret`. `optional: true` là bắt buộc: thiếu nó thì
          # mọi pod đứng CreateContainerConfigError cho tới khi có ai patch tay.
          - name: FACEBOOK_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: facebook_access_token
                optional: true
          # Broker mà Messenger đẩy App\Message\AMessage vào.
          #
          # CỐ Ý KHÔNG `optional: true`, ngược hẳn với FACEBOOK_ACCESS_TOKEN ở trên. Thiếu
          # key thì pod đứng CreateContainerConfigError và `kubectl describe pod` chỉ thẳng
          # key nào thiếu — đó là điều TỐT, vì thiếu DSN là app hỏng chứ không phải app
          # chạy thiếu một tính năng.
          #
          # Ngày 26/08/2026 `optional: true` đã trả giá: pod khởi động 07:12 lúc secret chưa
          # có key, key thêm vào lúc 07:37, mà đổi Secret thì không restart pod nên biến vẫn
          # rỗng. Symfony âm thầm rơi về DSN nướng trong `.env` của image (password cũ) và
          # /env/data trả 500 kèm "Could not connect to the AMQP server" — trông y như broker
          # chết, trong khi broker hoàn toàn khoẻ.
          - name: MESSENGER_TRANSPORT_DSN
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: messenger_transport_dsn
        envFrom:
          - configMapRef:
              name: frankenphp
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Probe và Service trỏ cổng theo TÊN `http`, không theo số. Đổi số cổng thì
        # Service tự gửi đúng cổng của từng pod trong lúc rollout: pod cũ cổng cũ, pod
        # mới cổng mới, không có khoảnh khắc nào request rơi vào cổng không ai nghe.
        ports:
        - name: http
          # Khớp SERVER_NAME trong ConfigMap frankenphp.
          containerPort: 8080
        # Probe gọi route của src/Controller/HealthController.php. tcpSocket trước đây chỉ
        # biết cổng 80 mở, nên Symfony lỗi 500 mà pod vẫn Ready.
        #
        # Chờ container khởi động xong (tối đa 60s) trước khi bật liveness/readiness
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 30
        # Kubernetes chỉ route traffic vào pod khi readiness pass
        # /health/ready có query DB: DB chết thì cả 2 pod cùng NotReady và ingress trả
        # 503 cho mọi route, kể cả route không cần DB. Chấp nhận, vì app gần như route
        # nào cũng chạm DB.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Nếu liveness fail liên tục, Kubernetes sẽ restart container
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3



