# RabbitMQ chạy StatefulSet, không phải Deployment — cùng lý do như postgres
# (xem postgres-statefulset.yaml): broker là stateful, và PVC sinh từ
# volumeClaimTemplates nằm ngoài tầm quản của ArgoCD nên Sync kèm Force/Replace
# không xoá được data.
#
# Vì sao cần broker: `config/packages/messenger.yaml` route App\Message\AMessage sang
# transport `common` = MESSENGER_TRANSPORT_DSN = amqp://…@rabbitmq:5672. Không có broker
# thì EnvDataController::index() ném TransportException và /env/data trả 500.
#
# LƯU Ý: Service phải tên đúng `rabbitmq` — đó là host trong DSN.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  annotations:
    # Reloader restart broker khi ConfigMap rabbitmq-definitions đổi. Thiếu nó thì
    # `load_definitions` chỉ áp ở lần boot kế tiếp — đổi password trong Git xong
    # không có gì xảy ra, rồi vỡ vào lúc broker tình cờ restart vì lý do khác.
    reloader.stakater.com/auto: "true"
spec:
  serviceName: rabbitmq-headless
  replicas: 1 # Broker 1 node, đủ cho dev. Cluster nhiều node cần thêm peer discovery plugin.
  selector:
    matchLabels:
      app: rabbitmq
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: rabbitmq # Service `rabbitmq` select theo label này
    spec:
      containers:
        - name: rabbitmq
          # Bản -management có sẵn UI ở cổng 15672. Pin theo minor để nâng cấp là việc
          # có ý thức, không phải tác dụng phụ của một lần pull.
          image: rabbitmq:3.13-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # CỐ Ý KHÔNG có RABBITMQ_DEFAULT_USER/PASS. Hai biến đó chỉ ăn khi mnesia
          # rỗng, nên với broker đã có data chúng là nguồn sự thật giả: Git ghi một
          # đằng, broker giữ một nẻo. Credential khai trong ConfigMap
          # rabbitmq-definitions và được `load_definitions` áp lại mỗi lần boot.
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
            # subPath chứ KHÔNG mount cả thư mục: /etc/rabbitmq/conf.d đã chứa
            # 10-defaults.conf của image, mount đè thư mục là mất nó.
            - name: definitions
              mountPath: /etc/rabbitmq/conf.d/20-definitions.conf
              subPath: 20-definitions.conf
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
          # `ping` chỉ hỏi node còn sống; đủ cho liveness.
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          # readiness khắt khe hơn `ping`: kiểm listener đã thật sự nhận được kết nối.
          # Node "sống" mà cổng 5672 chưa mở thì app vẫn ném TransportException.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 6
          # Khởi động chậm hơn postgres nhiều (Erlang VM + plugin), cho hạn 3 phút
          # trước khi liveness được phép giết.
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              # Viết "1", KHÔNG viết "1000m" — API server chuẩn hoá về "1" và Git ghi
              # khác đi là ArgoCD báo OutOfSync vĩnh viễn.
              cpu: "1"
      volumes:
        - name: definitions
          configMap:
            name: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
