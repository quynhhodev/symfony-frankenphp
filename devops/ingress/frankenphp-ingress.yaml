apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frankenphp-ingress
  annotations:
    # Rate limit theo IP client, khai ở frankenphp-middleware.yaml cùng thư mục.
    traefik.ingress.kubernetes.io/router.middlewares: default-frankenphp-ratelimit@kubernetescrd,default-frankenphp-inflight@kubernetescrd

spec:
  ingressClassName: traefik
  rules:
    - host: frankenphp.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frankenphp
              port:
                number: 80
