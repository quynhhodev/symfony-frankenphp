# Stakater Reloader — pin v1.4.21
#
# Vendor nguyên văn từ:
#   https://raw.githubusercontent.com/stakater/Reloader/v1.4.21/deployments/kubernetes/reloader.yaml
# Nâng cấp = tải lại file đó ở tag mới rồi dán đè, giữ nguyên khối comment này.
#
# Vì sao cần: đổi ConfigMap/Secret KHÔNG restart pod. ArgoCD sync nội dung mới vào
# cluster rất ngoan, nhưng pod đang chạy vẫn giữ giá trị đọc từ lúc khởi động. Đó
# chính là cơ chế đã để /env/data 500 suốt 25 phút ngày 26/08/2026: secret được patch
# lúc 07:37, pod khởi động lúc 07:12, và không ai nối hai việc đó lại.
#
# Reloader watch ConfigMap/Secret rồi rolling-restart workload nào có annotation
# `reloader.stakater.com/auto: "true"` — hiện là frankenphp, messenger-worker và
# rabbitmq. Đây là cơ chế, không phải kỷ luật: không còn bước nào phải nhớ.
#
# Không giới hạn namespace: cluster này chỉ có một tenant, và Reloader chỉ động vào
# workload có annotation nên phạm vi rộng không đồng nghĩa với rủi ro rộng.
#
# LƯU Ý: Reloader kích rollout bằng cách sửa pod template của workload. Nếu ArgoCD
# báo OutOfSync sau mỗi lần reload thì đổi sang `--reload-strategy=annotations`,
# hoặc thêm ignoreDifferences. Đã kiểm ở cuối Đợt 2 — xem PR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader-reloader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader-reloader-metadata-role
  namespace: default
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - list
  - get
  - watch
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reloader-reloader-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - statefulsets
  verbs:
  - list
  - get
  - update
  - patch
- apiGroups:
  - extensions
  resources:
  - deployments
  - daemonsets
  verbs:
  - list
  - get
  - update
  - patch
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - list
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - list
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader-reloader-metadata-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reloader-reloader-metadata-role
subjects:
- kind: ServiceAccount
  name: reloader-reloader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reloader-reloader-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reloader-reloader-role
subjects:
- kind: ServiceAccount
  name: reloader-reloader
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-reloader
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reloader-reloader
  template:
    metadata:
      labels:
        app: reloader-reloader
    spec:
      containers:
      - env:
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              divisor: "1"
              resource: limits.cpu
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              divisor: "1"
              resource: limits.memory
        - name: RELOADER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RELOADER_DEPLOYMENT_NAME
          value: reloader-reloader
        image: ghcr.io/stakater/reloader:v1.4.21
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: reloader-reloader
        ports:
        - containerPort: 9090
          name: http
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 512Mi
        securityContext: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: reloader-reloader
