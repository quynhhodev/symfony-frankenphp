apiVersion: v1
kind: Secret
metadata:
  name: frankenphp-secret
type: Opaque
stringData:
  password: mysecretpassword
  database_url: "postgresql://postgres:mysecretpassword@postgres-service:5432/myapp_db?serverVersion=15&charset=utf8"
  # User của RabbitMQ — không phải secret, để trong Git được.
  rabbitmq_user: quynh
  #
  # HAI KEY DƯỚI ĐÂY CỐ Ý KHÔNG CÓ TRONG GIT. Repo này public.
  rabbitmq_password: quynh12122001
  messenger_transport_dsn: amqp://quynh:quynh12122001@rabbitmq:5672/%2f/messages
  #
  # Nạp bằng tay, thay <pass> bằng password thật:
  #   kubectl --context multipass -n default patch secret frankenphp-secret \
  #     --type merge -p '{"stringData":{
  #       "rabbitmq_password":"<pass>",
  #       "messenger_transport_dsn":"amqp://quynh:<pass>@rabbitmq:5672/%2f/messages"}}'
  #
  # `%2f` là vhost `/` đã url-encode. Password trong DSN phải khớp rabbitmq_password,
  # lệch nhau thì RabbitMQ trả ACCESS_REFUSED và lỗi trông y như không có broker.
  #
  # CẢNH BÁO: password đang dùng (`quynh121201`) đã nằm plaintext trong `.env` của repo
  # public từ lâu — coi như đã cháy. Đổi password mới rồi mới patch vào đây.
