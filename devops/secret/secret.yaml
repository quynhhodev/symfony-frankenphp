apiVersion: v1
kind: Secret
metadata:
  name: frankenphp-secret
  annotations:
    # Reloader theo dõi Secret này qua annotation trên workload dùng nó
    # (frankenphp, messenger-worker) — không cần khai gì thêm ở đây.
    # Dòng này chỉ để người đọc biết: sửa file này LÀ sẽ restart pod.
    kubernetes.io/description: "Đổi nội dung ở đây sẽ khiến Reloader rolling-restart frankenphp và messenger-worker."
type: Opaque
stringData:
  password: mysecretpassword
  database_url: "postgresql://postgres:mysecretpassword@postgres-service:5432/myapp_db?serverVersion=15&charset=utf8"
  #
  # Password của RabbitMQ nằm plaintext ở đây LÀ CÓ CHỦ ĐÍCH, không phải sơ suất.
  #
  # Cơ chế cũ — giữ secret ngoài Git rồi `kubectl patch` tay — đã hỏng hai lần liên
  # tiếp: token Facebook, rồi chính password RabbitMQ bị commit thẳng vào file này,
  # nằm ngay dưới một comment viết hoa dặn đừng làm thế. Cơ chế nào phụ thuộc vào
  # việc con người nhớ thì sớm muộn cũng hỏng.
  #
  # Vấn đề thật không phải "password nằm trong Git" mà là "password có thể dùng ở chỗ
  # khác nằm trong Git". Giá trị dưới đây là đồ bỏ, chỉ sống trong cluster multipass
  # local, RabbitMQ không hề ra internet. Đổi lại được rất nhiều: ArgoCD quản đủ
  # secret, hết bootstrap tay, bỏ `optional` thành an toàn tuyệt đối, và Sync kiểu
  # Replace không thổi bay key nào.
  #
  # BẤT BIẾN: password trong DSN phải KHỚP `definitions.json` ở
  # devops/configmap/rabbitmq-definitions.yaml. Lệch nhau thì RabbitMQ trả
  # ACCESS_REFUSED và lỗi trông y như không có broker. Sửa một bên là phải sửa bên
  # kia — test.yml có guard chặn, nhưng đừng để nó phải chặn.
  #
  # `%2f` là vhost `/` đã url-encode.
  messenger_transport_dsn: amqp://quynh:local-dev-only@rabbitmq:5672/%2f/messages
  #
  # facebook_access_token CỐ Ý không có ở đây, và đó KHÔNG mâu thuẫn với đoạn trên:
  # nó là token thật của bên thứ ba, lộ ra là mất tài khoản — khác hẳn một password
  # đồ bỏ chỉ dùng trong cluster local. Nạp bằng tay khi nào cần dùng lại:
  #   kubectl --context multipass -n default patch secret frankenphp-secret \
  #     --type merge -p '{"stringData":{"facebook_access_token":"<token>"}}'
