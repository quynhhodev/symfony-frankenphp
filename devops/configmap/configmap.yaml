apiVersion: v1
kind: ConfigMap
metadata:
  name: frankenphp
data:
  APP_RUNTIME_ENV: 'prod'
  APP_ENV: 'prod'
  # Cổng container, không phải cổng người dùng gọi: Service frankenphp nhận ở 80
  # rồi chuyển tới đây. Phải khớp `containerPort` trong frankenphp-deployment.yaml.
  SERVER_NAME: ':8080'
  DB: 'myapp_db'
  DB_HOST: 'postgres-service'
  DB_PORT: '5432'
  DB_USER: 'postgres'