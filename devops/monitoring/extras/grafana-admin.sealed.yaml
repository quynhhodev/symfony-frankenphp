# SINH BỞI kubeseal (lệnh trong devops/MONITORING.md), đừng sửa tay. Chỉ controller của
# cụm multipass mở được, và chỉ thành Secret monitoring/grafana-admin.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
    type: Opaque
