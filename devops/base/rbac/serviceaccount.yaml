# Danh tính của frankenphp, messenger-worker và migration Job.
#
# Không gắn Role nào: app không gọi API của k8s. Có SA riêng thay vì dùng `default`
# để sau này cấp quyền (nếu cần) thì chỉ app nhận, không lan sang Postgres/RabbitMQ.
#
# automountServiceAccountToken: false ở đây là mặc định cho mọi pod dùng SA này;
# pod spec cũng khai lại cho rõ ràng.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frankenphp
automountServiceAccountToken: false
