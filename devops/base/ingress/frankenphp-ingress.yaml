apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frankenphp-ingress
  annotations:
    # Rate limit theo IP client, khai ở frankenphp-middleware.yaml cùng thư mục.
    # Tiền tố `frankenphp-` là NAMESPACE (namespace: trong base/kustomization.yaml).
    # Kustomize không sửa được chuỗi này: đổi namespace là phải sửa tay ở đây.
    traefik.ingress.kubernetes.io/router.middlewares: frankenphp-frankenphp-ratelimit@kubernetescrd,frankenphp-frankenphp-inflight@kubernetescrd

spec:
  ingressClassName: traefik
  rules:
    - host: frankenphp.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frankenphp
              port:
                number: 80
