apiVersion: batch/v1
kind: Job
metadata:
  name: doctrine-migrations
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      # SA riêng, KHÔNG gắn token API k8s: app không gọi API của cụm, nên lọt vào
      # pod cũng không có token để dò hay phá cụm.
      serviceAccountName: frankenphp
      automountServiceAccountToken: false
      # Cùng securityContext với frankenphp-deployment.yaml (lý do ghi ở đó). Process
      # ở đây là `php`, không phải binary frankenphp, nên không cần NET_BIND_SERVICE.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: devho/franken-php
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        # Bắt buộc từ khi namespace có ResourceQuota: quota tính limits nên pod không
        # khai thì bị từ chối tạo (LimitRange chỉ là lưới đỡ thứ hai).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        workingDir: /app/public
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_PORT
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: frankenphp
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: password
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: frankenphp-secret
                key: database_url
        envFrom:
          - configMapRef:
              name: frankenphp
