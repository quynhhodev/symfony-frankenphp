apiVersion: v1
kind: Service
metadata:
  name: frankenphp
spec:
  type: ClusterIP
  selector:
    app: frankenphp
  ports:
  - name: http
    protocol: TCP
    port: 80
    # Theo TÊN cổng của pod (hiện là 8080). Lúc rollout, pod cũ và pod mới có thể
    # mở số cổng khác nhau, Service vẫn gửi đúng cổng của từng pod.
    targetPort: http
