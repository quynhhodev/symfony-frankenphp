services:
  apache:
    build:
      context: .
      dockerfile: ./docker/frankenphp/Dockerfile
    ports:
      - target: 80
        published: 80
        protocol: tcp
    environment:
      SERVER_NAME: :80
    volumes:
      - ./:/app/public
      - caddy_data:/data
      - caddy_config:/config

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Password đồ bỏ, cố ý để plaintext — cùng lý do như devops/secret/secret.yaml:
      # cluster/compose này chỉ chạy local, và giá trị nào có thể trùng password thật
      # mới là thứ không được nằm trong repo public.
      #
      # BẪY: POSTGRES_PASSWORD chỉ có tác dụng khi thư mục data còn RỖNG, tức lần
      # `up` đầu tiên của một volume mới. Volume `database_data` đã init rồi thì đổi
      # dòng này không đổi được gì — y hệt RABBITMQ_DEFAULT_PASS với mnesia. Muốn đổi
      # password trên volume đang có:
      #   docker compose exec database psql -U app -c "ALTER USER app WITH PASSWORD '<pass>'"
      # (kết nối qua socket local nên không cần password cũ)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
  # CẢNH BÁO: service này dùng chung database 'app' với Symfony và tự tạo
  # schema hdb_catalog trong đó.
  #
  # Tool nào dùng chung database này BẮT BUỘC phải giữ bảng của nó trong một
  # schema riêng, KHÔNG thả vào public. doctrine.yaml lọc mọi schema ngoài
  # search_path, nên schema riêng thì vô hình với Doctrine; còn bảng rơi vào
  # public sẽ làm `doctrine:schema:validate` đỏ trên CI (test.yml).
  #
  # Sắp thêm Debezium: khai signal/heartbeat table dạng đủ 3 phần
  # (<database>.debezium.signal) thay vì để mặc định vào public.
  hasura:
    image: hasura/graphql-engine:v2.42.0
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Default ở đây phải KHỚP default của service `database` bên trên — cùng một
      # biến, viết `:-` hai lần thì hai giá trị mặc định phải giống nhau, lệch là
      # Hasura ăn auth error mà `compose up --wait` không bắt được (nó không có
      # healthcheck).
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-local-dev-only}@database:5432/${POSTGRES_DB:-app}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-mysecretkey}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    ports:
      - target: 5672
        published: 5672
        protocol: tcp
      - target: 15672
        published: 15672
        protocol: tcp
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-quynh}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-dev-only}
      # RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true

volumes:
    caddy_data:
    caddy_config:
    database_data:
