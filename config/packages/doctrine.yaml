doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Database này dùng chung với các tool ngoài Symfony: Hasura tự tạo
        # schema hdb_catalog, sắp tới sẽ có thêm Debezium. Doctrine chỉ chịu
        # trách nhiệm cho search_path — mọi schema riêng của tool khác đều bỏ qua.
        # Không lọc thì schema:validate coi chúng là drift, và migrations:diff
        # sẽ sinh lệnh DROP chúng (đó chính là Version20260414082747 đã bị xoá).
        # Quy ước: tool mới phải nằm trong schema riêng, không thả bảng vào public.
        #
        # `messenger_messages` là ngoại lệ bắt buộc: failure_transport `failed` là
        # doctrine:// và Messenger tự đẻ bảng đó vào public qua auto_setup, không
        # migration nào tạo. Doctrine không có entity nào map tới nó, nên không loại
        # ra thì schema:validate (chạy ở test.yml) báo đỏ và migrations:diff sinh
        # `DROP TABLE messenger_messages` — xoá sạch message chết. Đúng cái bẫy
        # hdb_catalog đã dính, chỉ khác là lần này bảng không nằm trong schema riêng
        # được vì Messenger không cho chọn schema.
        schema_filter: '~^(?!.*\.)(?!messenger_messages)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
