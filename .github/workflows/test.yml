name: Tests

on:
  pull_request:
    branches: [ "main" ]
  # do-ci.yml gọi file này làm cổng: push code vào main chỉ được build và deploy
  # khi test xanh.
  workflow_call:
  # Push chỉ đụng devops/ thì do-ci.yml bỏ qua (paths-ignore), nên tự kích ở đây để
  # guard Secret niêm phong vẫn chạy — đúng phần bù của filter bên đó. ArgoCD apply
  # devops/ ngay khi có commit, nên với loại push này test chỉ báo lỗi, không chặn được.
  #
  # Push đụng cả devops/ lẫn code thì test chạy HAI lần (ở đây và qua do-ci.yml). Cố ý
  # chấp nhận. Bỏ trùng nghĩa là bỏ paths-ignore của do-ci.yml rồi tự dò file đổi trong
  # job, và khi đó push chỉ đụng devops/ sẽ vào nhóm concurrency deploy-main, huỷ ngang
  # bản build code đang chạy.
  push:
    branches: [ "main" ]
    paths:
      - 'devops/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Secret của cụm nằm trong git dưới dạng SealedSecret (devops/scripts/seal-secrets.sh),
      # nên CI không đọc được password để so như trước. Thay vào đó:
      # - script tự dựng mọi chỗ dùng chung một password; `check` chạy nó với giá trị giả
      #   và kiểm DSN, database_url, definitions.json khớp nhau (lệch là ACCESS_REFUSED,
      #   lỗi trông y như broker chết).
      # - không một Secret chữ thường nào được lọt vào devops/ (repo public).
      # - không ConfigMap nào chứa password (definitions.json đã chuyển sang Secret).
      - name: Secret niêm phong, không password chữ thường
        run: |
          set -euo pipefail
          devops/scripts/seal-secrets.sh check

          plain=$(grep -rlE '^kind:[[:space:]]*Secret[[:space:]]*$' devops --include='*.yaml' --include='*.yml' || true)
          if [ -n "$plain" ]; then
            echo "LỖI: Secret chữ thường trong repo public, dùng devops/scripts/seal-secrets.sh:" >&2
            echo "$plain" >&2
            exit 1
          fi

          for o in devops/overlays/*/; do
            if kubectl kustomize "$o" | awk '/^kind: ConfigMap$/{cm=1} /^---$/{cm=0} cm' | grep -qi 'password'; then
              echo "LỖI: $o có ConfigMap chứa chữ \"password\"" >&2
              exit 1
            fi
          done
          echo "OK: không Secret chữ thường, không password trong ConfigMap."

      # Kustomize không tự quét thư mục: manifest quên khai trong base/kustomization.yaml
      # thì không ra cụm, và ArgoCD (`prune: true`) XOÁ resource đang chạy của nó. Không có
      # lỗi nào báo, nên chặn ở PR. Kèm render mọi overlay để overlay chưa ai dùng (vps,
      # minikube) không âm thầm hỏng.
      - name: Kustomize khai đủ manifest và render được mọi overlay
        run: |
          set -euo pipefail
          cd devops/base
          listed=$(grep -oE '^\s+- \S+\.ya?ml' kustomization.yaml | awk '{print $2}' | sort)
          actual=$(find . -name '*.yaml' -o -name '*.yml' | sed 's#^\./##' | grep -vx 'kustomization.yaml' | sort)
          missing=$(comm -13 <(echo "$listed") <(echo "$actual"))
          if [ -n "$missing" ]; then
            echo "LỖI: có trong devops/base/ nhưng chưa khai ở resources của kustomization.yaml:" >&2
            echo "$missing" >&2
            exit 1
          fi
          cd ../..

          for o in devops/overlays/*/; do
            kubectl kustomize "$o" > /dev/null
            echo "OK: $o"
          done

      # Unit test Bloblang của pipeline CDC. Không cần Kafka hay RabbitMQ.
      # `lint -r` không expand glob (khác `run`/`test`), nên phải liệt kê từng file resource.
      - name: Redpanda Connect lint + test
        run: |
          set -euo pipefail
          rpc() {
            docker run --rm -v "$PWD:/w" -w /w docker.redpanda.com/redpandadata/connect:4.67.5 "$@"
          }
          rpc lint -t './redpanda-connect/template/*.yaml' \
            $(printf -- '-r %s ' redpanda-connect/resource/app/*.yaml) \
            ./redpanda-connect/app.yaml
          rpc test -t './redpanda-connect/template/*.yaml' \
            -r './redpanda-connect/resource/app/*.yaml' \
            ./redpanda-connect/app.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Start services
        run: docker compose -f compose.yml up -d --wait

      - name: Install dependencies
        run: docker compose -f compose.yml exec -T apache composer install --no-interaction --no-progress --optimize-autoloader

      # Có CdcContractTest: body mà pipeline CDC sinh ra phải decode được thành đúng message.
      - name: PHPUnit
        run: docker compose -f compose.yml exec -T apache vendor/bin/phpunit

      - name: Run migrations
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Validate Doctrine schema
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:schema:validate

  # Kiểm schema của YAML THẬT SỰ lên cụm (Kustomize render ra), không chỉ cú pháp Kustomize.
  # Gõ sai trường (`minReplica:`) hay sai apiVersion thì `kubectl kustomize` vẫn qua, chỉ lỗi
  # lúc ArgoCD sync, tức là sau merge. `-strict` bắt cả trường không tồn tại; resource thiếu
  # schema thì báo lỗi chứ không bỏ qua.
  manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: kubeconform mọi overlay
        run: |
          set -euo pipefail
          # Schema CRD (SealedSecret, Middleware của Traefik) lấy từ CRDs-catalog, ghim commit
          # để kết quả không đổi theo upstream. Phiên bản k8s khớp cụm multipass (v1.35.9).
          CAT='https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          mkdir -p /tmp/render
          for o in devops/overlays/*/; do
            kubectl kustomize "$o" > "/tmp/render/$(basename "$o").yaml"
          done
          # Phần monitoring riêng của dự án (SealedSecret, dashboard, PrometheusRule).
          kubectl kustomize devops/monitoring/extras > /tmp/render/monitoring-extras.yaml
          docker run --rm -v /tmp/render:/w \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.35.0 \
            -schema-location default -schema-location "$CAT" /w

  # Build ĐÚNG image prod như do-ci.yml (stage cuối của Dockerfile) ngay ở PR. Trước đây PR
  # chỉ build stage dev (compose), nên lỗi riêng của stage prod (thiếu file, composer
  # --no-dev hỏng, sai quyền) chỉ lộ ra sau merge, lúc main đã đỏ và không deploy được.
  #
  # Rồi quét lỗ hổng bằng Trivy: gói OS của base image và thư viện Composer
  # (vendor/composer/installed.json). Không thêm `composer audit`: Trivy đã quét đúng phần đó.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Không push: chỉ do-ci.yml được đẩy image. Đọc cache gha mà do-ci.yml ghi, nên PR
      # build lại phần dependency không đổi rất nhanh.
      - name: Build image prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile
          push: false
          load: true
          tags: franken-php:ci
          # Luôn kéo base image mới nhất: tag dunglas/frankenphp:1-php8.4 được upstream đẩy
          # bản vá liên tục. Thử 01/11/2026: base cũ trong cache còn libbrotli1 dính CVE
          # CRITICAL đã có bản vá, base mới thì sạch.
          pull: true
          cache-from: type=gha

      - name: Trivy quét lỗ hổng
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
              image --quiet "$@" franken-php:ci
          }

          # Báo cáo, KHÔNG chặn: mọi HIGH/CRITICAL đã có bản vá, ghi ra trang tóm tắt của job.
          {
            echo '### Trivy: lỗ hổng HIGH/CRITICAL đã có bản vá'
            echo '```'
            trivy --severity HIGH,CRITICAL --ignore-unfixed --format table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # CỔNG CHẶN: HIGH và CRITICAL đã có bản vá. Lỗ hổng chưa có bản vá (--ignore-unfixed)
          # không chặn, vì không PR nào sửa được: phải chờ Debian/upstream vá.
          #
          # Siết từ CRITICAL lên HIGH sau khi nâng Symfony 7.3 -> 7.4 (01/11/2026): 7.3 hết vá,
          # còn 7 HIGH (cache, http-foundation, yaml); 7.4 thì 0. Đỏ ở đây thường là: nâng
          # bản vá của thư viện (`composer update <gói>`), hoặc base image mới hơn (`pull: true`
          # đã lo phần base).
          trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table
