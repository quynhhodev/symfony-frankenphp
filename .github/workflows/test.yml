name: Tests

on:
  pull_request:
    branches: [ "main" ]
  # do-ci.yml gọi file này làm cổng: push code vào main chỉ được build và deploy
  # khi test xanh.
  workflow_call:
  # Push chỉ đụng devops/ thì do-ci.yml bỏ qua (paths-ignore), nên tự kích ở đây để
  # guard password RabbitMQ vẫn chạy — đúng phần bù của filter bên đó. ArgoCD apply
  # devops/ ngay khi có commit, nên với loại push này test chỉ báo lỗi, không chặn được.
  #
  # Push đụng cả devops/ lẫn code thì test chạy HAI lần (ở đây và qua do-ci.yml). Cố ý
  # chấp nhận. Bỏ trùng nghĩa là bỏ paths-ignore của do-ci.yml rồi tự dò file đổi trong
  # job, và khi đó push chỉ đụng devops/ sẽ vào nhóm concurrency deploy-main, huỷ ngang
  # bản build code đang chạy.
  push:
    branches: [ "main" ]
    paths:
      - 'devops/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Password RabbitMQ buộc phải trùng ở hai nơi: DSN trong secret.yaml và
      # definitions.json trong ConfigMap. Không có gì trong k8s ép được ràng buộc đó,
      # và lệch nhau thì triệu chứng là ACCESS_REFUSED — trông y như broker chết,
      # tốn hàng giờ để lần ra. Chặn ngay ở PR rẻ hơn nhiều.
      - name: RabbitMQ password khớp giữa secret và definitions
        run: |
          set -euo pipefail
          dsn=$(grep -oP 'amqp://[^:]+:\K[^@]+' devops/secret/secret.yaml || true)
          def=$(grep -oP '"password"\s*:\s*"\K[^"]+' devops/configmap/rabbitmq-definitions.yaml || true)

          if [ -z "$dsn" ] || [ -z "$def" ]; then
            echo "LỖI: không trích được password (dsn='$dsn' definitions='$def')." >&2
            echo "File đã đổi cấu trúc — sửa guard này thay vì xoá nó." >&2
            exit 1
          fi

          if [ "$dsn" != "$def" ]; then
            echo "LỖI: password lệch — DSN='$dsn' nhưng definitions.json='$def'." >&2
            echo "RabbitMQ sẽ trả ACCESS_REFUSED và lỗi trông y như broker chết." >&2
            exit 1
          fi

          echo "OK: password khớp ở cả hai nơi."

      # Unit test Bloblang của pipeline CDC. Không cần Kafka hay RabbitMQ.
      # `lint -r` không expand glob (khác `run`/`test`), nên phải liệt kê từng file resource.
      - name: Redpanda Connect lint + test
        run: |
          set -euo pipefail
          rpc() {
            docker run --rm -v "$PWD:/w" -w /w docker.redpanda.com/redpandadata/connect:4.67.5 "$@"
          }
          rpc lint -t './redpanda-connect/template/*.yaml' \
            $(printf -- '-r %s ' redpanda-connect/resource/app/*.yaml) \
            ./redpanda-connect/app.yaml
          rpc test -t './redpanda-connect/template/*.yaml' \
            -r './redpanda-connect/resource/app/*.yaml' \
            ./redpanda-connect/app.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Start services
        run: docker compose -f compose.yml up -d --wait

      - name: Install dependencies
        run: docker compose -f compose.yml exec -T apache composer install --no-interaction --no-progress --optimize-autoloader

      # Có CdcContractTest: body mà pipeline CDC sinh ra phải decode được thành đúng message.
      - name: PHPUnit
        run: docker compose -f compose.yml exec -T apache vendor/bin/phpunit

      - name: Run migrations
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Validate Doctrine schema
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:schema:validate
