name: Tests

on:
  pull_request:
    branches: [ "main" ]
  # do-ci.yml gọi file này làm cổng: push code vào main chỉ được build và deploy
  # khi test xanh.
  workflow_call:
  # Push chỉ đụng devops/ thì do-ci.yml bỏ qua (paths-ignore), nên tự kích ở đây để
  # guard Secret niêm phong vẫn chạy — đúng phần bù của filter bên đó. ArgoCD apply
  # devops/ ngay khi có commit, nên với loại push này test chỉ báo lỗi, không chặn được.
  #
  # Push đụng cả devops/ lẫn code thì test chạy HAI lần (ở đây và qua do-ci.yml). Cố ý
  # chấp nhận. Bỏ trùng nghĩa là bỏ paths-ignore của do-ci.yml rồi tự dò file đổi trong
  # job, và khi đó push chỉ đụng devops/ sẽ vào nhóm concurrency deploy-main, huỷ ngang
  # bản build code đang chạy.
  push:
    branches: [ "main" ]
    paths:
      - 'devops/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Secret của cụm nằm trong git dưới dạng SealedSecret (devops/scripts/seal-secrets.sh),
      # nên CI không đọc được password để so như trước. Thay vào đó:
      # - script tự dựng mọi chỗ dùng chung một password; `check` chạy nó với giá trị giả
      #   và kiểm DSN, database_url, definitions.json khớp nhau (lệch là ACCESS_REFUSED,
      #   lỗi trông y như broker chết).
      # - không một Secret chữ thường nào được lọt vào devops/ (repo public).
      # - không ConfigMap nào chứa password (definitions.json đã chuyển sang Secret).
      - name: Secret niêm phong, không password chữ thường
        run: |
          set -euo pipefail
          devops/scripts/seal-secrets.sh check

          plain=$(grep -rlE '^kind:[[:space:]]*Secret[[:space:]]*$' devops --include='*.yaml' --include='*.yml' || true)
          if [ -n "$plain" ]; then
            echo "LỖI: Secret chữ thường trong repo public, dùng devops/scripts/seal-secrets.sh:" >&2
            echo "$plain" >&2
            exit 1
          fi

          for o in devops/overlays/*/; do
            if kubectl kustomize "$o" | awk '/^kind: ConfigMap$/{cm=1} /^---$/{cm=0} cm' | grep -qi 'password'; then
              echo "LỖI: $o có ConfigMap chứa chữ \"password\"" >&2
              exit 1
            fi
          done
          echo "OK: không Secret chữ thường, không password trong ConfigMap."

      # Kustomize không tự quét thư mục: manifest quên khai trong base/kustomization.yaml
      # thì không ra cụm, và ArgoCD (`prune: true`) XOÁ resource đang chạy của nó. Không có
      # lỗi nào báo, nên chặn ở PR. Kèm render mọi overlay để overlay chưa ai dùng (vps,
      # minikube) không âm thầm hỏng.
      - name: Kustomize khai đủ manifest và render được mọi overlay
        run: |
          set -euo pipefail
          cd devops/base
          listed=$(grep -oE '^\s+- \S+\.ya?ml' kustomization.yaml | awk '{print $2}' | sort)
          actual=$(find . -name '*.yaml' -o -name '*.yml' | sed 's#^\./##' | grep -vx 'kustomization.yaml' | sort)
          missing=$(comm -13 <(echo "$listed") <(echo "$actual"))
          if [ -n "$missing" ]; then
            echo "LỖI: có trong devops/base/ nhưng chưa khai ở resources của kustomization.yaml:" >&2
            echo "$missing" >&2
            exit 1
          fi
          cd ../..

          for o in devops/overlays/*/; do
            kubectl kustomize "$o" > /dev/null
            echo "OK: $o"
          done

      # Unit test Bloblang của pipeline CDC. Không cần Kafka hay RabbitMQ.
      # `lint -r` không expand glob (khác `run`/`test`), nên phải liệt kê từng file resource.
      - name: Redpanda Connect lint + test
        run: |
          set -euo pipefail
          rpc() {
            docker run --rm -v "$PWD:/w" -w /w docker.redpanda.com/redpandadata/connect:4.67.5 "$@"
          }
          rpc lint -t './redpanda-connect/template/*.yaml' \
            $(printf -- '-r %s ' redpanda-connect/resource/app/*.yaml) \
            ./redpanda-connect/app.yaml
          rpc test -t './redpanda-connect/template/*.yaml' \
            -r './redpanda-connect/resource/app/*.yaml' \
            ./redpanda-connect/app.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Start services
        run: docker compose -f compose.yml up -d --wait

      - name: Install dependencies
        run: docker compose -f compose.yml exec -T apache composer install --no-interaction --no-progress --optimize-autoloader

      # Có CdcContractTest: body mà pipeline CDC sinh ra phải decode được thành đúng message.
      - name: PHPUnit
        run: docker compose -f compose.yml exec -T apache vendor/bin/phpunit

      - name: Run migrations
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Validate Doctrine schema
        run: docker compose -f compose.yml exec -T apache php bin/console doctrine:schema:validate
